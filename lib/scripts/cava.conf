# Cava config for the simple-bar audio visualization widget.
# Captures system audio via CoreAudio process tap (macOS 14.2+), which does not
# require any microphone permission. Frames are written to stdout in ascii raw
# mode, one line per frame, values separated by ";" and ranging from 0 to 100.

[general]
bars = 24
framerate = 120
autosens = 1
scaling = linear
lower_cutoff_freq = 50
higher_cutoff_freq = 8000

[input]
method = coreaudio
source = tap

[output]
method = raw
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
noise_reduction = 40
