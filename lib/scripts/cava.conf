# Cava config for the simple-bar audio visualization widget.
# Captures system audio via CoreAudio process tap (macOS 14.2+), which does not
# require any microphone permission. Frames are written to stdout in ascii raw
# mode, one line per frame, values separated by ";" and ranging from 0 to 100.

[general]
bars = 24
framerate = 60
autosens = 1
sensitivity = 100
scaling = linear
lower_cutoff_freq = 40
higher_cutoff_freq = 12000

[input]
method = coreaudio
source = tap_mono

[output]
method = raw
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

channels = mono
mono_option = average

[smoothing]
noise_reduction = 65
